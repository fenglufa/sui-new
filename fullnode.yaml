# Update this value to the location you want Sui to store its database
db-path: "/Volumes/superfs/suidata/db"

# For ipv4, update this to "/ip4/X.X.X.X/tcp/8080/http"
network-address: "/dns/localhost/tcp/8080/http"
metrics-address: "0.0.0.0:9184"
# this address is also used for web socket connections
json-rpc-address: "0.0.0.0:9000"

# --- MEV 补丁（block A）：向进程外 simulator/bot 推送已提交数据 -----------------
# 两个都是顶级字段，必须顶格 + kebab-case（NodeConfig 上有 rename_all = "kebab-case"）。
# 写错名字不会报错：NodeConfig 没有 deny_unknown_fields，字段会被静默忽略，
# 节点照常启动但推送功能没开。用 ./start_mev_node.sh check 验证。
# 不设 = 完全关闭推送路径（向后兼容）。节点 bind 并 listen，bot 是客户端去 connect。
# 路径故意用 bot 侧 --update-cache-socket / --tx-socket-path 的默认值，这样 bot 不用传参。
mev-cache-update-socket: "/tmp/sui_cache_updates.sock"
mev-tx-socket: "/tmp/sui_tx.sock"


