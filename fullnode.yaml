genesis:
  # Update this to the location of where the genesis file is stored
  genesis-file-location: "/Volumes/superfs/suidata/genesis.blob"

authority-store-pruning-config:
  num-latest-epoch-dbs-to-retain: 3
  epoch-db-pruning-period-secs: 3600
  num-epochs-to-retain: 5
  num-epochs-to-retain-for-checkpoints: 2
  periodic-compaction-threshold-days: 1
  max-checkpoints-in-batch: 10
  max-transactions-in-batch: 1000
  pruning-run-delay-seconds: 60

# 注意：这个键只能出现一次。serde_yaml 遇到重复键会直接 panic：
#   "called `Result::unwrap()` on an `Err` value: duplicate field `state-archive-read-config`"
# 另外 NodeConfig::archive_reader_config() 取的是 .first()（node.rs:1090），
# 所以列表里只有第一条真正生效，后面的都是死配置。想换源就改第一条。
state-archive-read-config:
    # Use https://checkpoints.mainnet.sui.io for mainnet
    # Use https://checkpoints.testnet.sui.io for testnet
    - ingestion-url: "https://s3.us-west-2.amazonaws.com/mysten-mainnet-checkpoints"
      concurrency: 5
      remote-store-options:
        - ["aws_request_payer", "true"]
